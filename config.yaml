# yaml-language-server: $schema=https://agentgateway.dev/schema/config
#
# agentgateway -> CoreWeave Serverless Inference, with traces sent to W&B Weave / Agent Lens.
# Values written as $-brace env references are substituted from the environment (see .env.example).

frontendPolicies:
  tracing:
    # Weave agent-span OTLP/HTTP ingest (Weave Agents view and Agent Lens).
    host: trace.wandb.ai:443
    protocol: http
    path: /agents/otel/v1/traces
    randomSampling: true
    policies:
      backendTLS: {}
      requestHeaderModifier:
        set:
          wandb-api-key: "${WANDB_API_KEY}"

    # Resource attributes: apply to every span this gateway exports.
    resources:
      service.name: '"${GATEWAY_NAME}"'
      deployment.environment.name: '"${GATEWAY_ENV}"'
      wandb.entity: '"${WANDB_ENTITY}"'
      wandb.project: '"${WANDB_PROJECT}"'

    # Only export LLM calls (drops health checks and other non-LLM traffic).
    filter: 'llm.provider != ""'

    # agentgateway already sets gen_ai.operation.name, provider, request/response model,
    # token usage (incl. cache reads and reasoning) and request params.
    # These add what the gateway cannot know on its own.
    attributes:
      gen_ai.conversation.id: 'request.headers["x-conversation-id"]'
      gen_ai.agent.name: 'request.headers["x-agent-name"]'
      user.id: 'request.headers["x-user-id"]'

      # Read from the response body, because the pinned image leaves its native fields empty.
      # Omitted when the body is gzip-encoded (the client sent Accept-Encoding: gzip) or streamed.
      gen_ai.response.id: 'json(response.body).id'
      gen_ai.response.finish_reasons: 'json(response.body).choices[0].finish_reason'

      # Prompt/response capture (on by default; remove these three for sensitive content).
      gen_ai.system_instructions: 'toJson(llm.prompt.filter(m, m.role == "system").map(m, {"type": "text", "content": m.content}))'
      gen_ai.input.messages: 'toJson(llm.prompt.filter(m, m.role != "system").map(m, {"role": m.role, "parts": [{"type": "text", "content": m.content}]}))'
      gen_ai.output.messages: 'toJson([{"role": "assistant", "parts": llm.completion.filter(c, c != "").map(c, {"type": "text", "content": c}) + (has(llm.toolCalls) ? llm.toolCalls : []).map(t, {"type": "tool_call", "id": t.id, "name": t.name, "arguments": t.arguments})}])'


llm:
  port: 4000
  models:
  # Clients send model "coreweave/<model id>", e.g. coreweave/moonshotai/Kimi-K2.6
  - name: "coreweave/*"
    provider: coreweave
    params:
      apiKey: "${WANDB_API_KEY}"   # W&B API key works for CoreWeave inference too
    transformation:
      model: llmRequest.model.stripPrefix("coreweave/")
